when:
  - event: push
    branch: main
  - event: pull_request
    branch: main
  - event: tag
    ref: refs/tags/v*

clone:
  git:
    image: woodpeckerci/plugin-git:2.9.2
    settings:
      depth: 0
      partial: false
      tags: true
      lfs: false
      recursive: false

steps:
  fmt:
    image: golang:latest
    commands:
      - |
        fmt_out=$(gofmt -l .)
        if [ -n "$fmt_out" ]; then
          echo "The following files need gofmt:"
          echo "$fmt_out"
          exit 1
        fi

  lint:
    image: golangci/golangci-lint:v2.12.2-alpine
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
    commands:
      - golangci-lint run --config .golangci.yml ./...

  vet:
    image: golang:latest
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      - go vet ./...

  test:
    image: golang:latest
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      - go mod verify
      - go test ./...

  test-race:
    image: golang:latest
    environment:
      GOCACHE: /tmp/.gocache-race
    commands:
      - go test -race ./...

  database:
    image: postgres:18-alpine
    detach: true
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: miniflux

  wait-database:
    image: postgres:18-alpine
    depends_on:
      - database
    commands:
      - |
        attempt=0
        until pg_isready -h database -U miniflux -d miniflux; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 60 ]; then
            echo "PostgreSQL did not become ready within 60 seconds"
            exit 1
          fi
          sleep 1
        done

  miniflux:
    image: miniflux/miniflux:2.3.3
    detach: true
    depends_on:
      - wait-database
    environment:
      BASE_URL: http://miniflux:8080
      DATABASE_URL: postgres://miniflux:secret@database/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test123

  wait-miniflux:
    image: curlimages/curl:8.16.0
    depends_on:
      - miniflux
    commands:
      - |
        attempt=0
        until curl --fail --silent --show-error http://miniflux:8080/healthcheck >/dev/null; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 60 ]; then
            echo "Miniflux did not become ready within 60 seconds"
            exit 1
          fi
          sleep 1
        done

  e2e:
    image: golang:latest
    depends_on:
      - wait-miniflux
    environment:
      GOCACHE: /tmp/.gocache-e2e
    commands:
      - make e2e-test E2E_MINIFLUX_URL=http://miniflux:8080

  build:
    image: golang:latest
    depends_on:
      - fmt
      - lint
      - vet
      - test
      - test-race
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      - make build

  prepare-release:
    image: alpine:latest
    depends_on:
      - build
      - e2e
    commands:
      - |
        mkdir -p tmp
        build_date=$(date -u -d "@${CI_COMMIT_TIMESTAMP}" +'%Y-%m-%dT%H:%M:%SZ')
        printf 'VERSION=%s\nREVISION=%s\nBUILD_DATE=%s\n' \
          '${CI_COMMIT_TAG##v}' \
          '${CI_COMMIT_SHA:0:7}' \
          "$build_date" >tmp/release.env
    when:
      - event: tag

  release-forgejo:
    image: goreleaser/goreleaser:v2.17.1
    depends_on:
      - build
      - e2e
    environment:
      FORGE_TOKEN:
        from_secret: FORGE_TOKEN
    commands:
      - test -n "$CI_FORGE_URL" || (echo "CI_FORGE_URL is empty. Cannot derive Forge URLs for GoReleaser." && exit 1)
      - export GITEA_TOKEN="$FORGE_TOKEN"
      - export FORGE_API_URL="$CI_FORGE_URL/api/v1"
      - export FORGE_DOWNLOAD_URL="$CI_FORGE_URL"
      - goreleaser release --clean
    when:
      - event: tag

  release-docker:
    image: woodpeckerci/plugin-docker-buildx:6
    depends_on:
      - prepare-release
    settings:
      repo:
        - skobkin/miniflux-mcp-hardened
      dockerfile: Dockerfile
      env_file: tmp/release.env
      build_args_from_env:
        - VERSION
        - REVISION
        - BUILD_DATE
      auto_tag: true
      cache_images:
        - skobkin/miniflux-mcp-hardened:buildcache
      platforms:
        - linux/amd64
      logins:
        - registry: https://index.docker.io/v1/
          username:
            from_secret: DOCKER_LOGIN
          password:
            from_secret: DOCKER_TOKEN
    when:
      - event: tag
